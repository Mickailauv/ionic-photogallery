name: Build Ionic Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: photo-gallery/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          cd photo-gallery
          npm ci

      - name: Build Web Assets
        run: |
          cd photo-gallery
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd photo-gallery
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd photo-gallery/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IonicPhotoGallery-APK
          path: photo-gallery/android/app/build/outputs/apk/debug/app-debug.apk